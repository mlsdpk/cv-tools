name: Docker

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - pyproject.toml
      - src/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mlsdpk/cv-tools

jobs:
  test:
    name: Build and test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: cv-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the example inside the image
        run: |
          mkdir smoke
          cp examples/cv.yaml examples/publications.bib smoke/
          docker run --rm --user "$(id -u):$(id -g)" --mount "type=bind,source=$PWD/smoke,target=/work" \
            cv-tools:ci build cv.yaml
          test -s smoke/cv.pdf
          docker run --rm cv-tools:ci doctor

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the example with --engine docker from the runner
        env:
          CV_TOOLS_IMAGE: cv-tools:ci
        run: |
          python -m pip install .
          cv-tools build examples/cv.yaml --engine docker -o host/cv.pdf
          test -s host/cv.pdf

  ci:
    name: Tests
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  version:
    name: Check the tag against the package version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 'cv-tools build --engine docker' asks for the image of cv_tools.__version__.
      - name: Compare the tag with cv_tools.__version__
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/cv_tools/__init__.py)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} does not match cv_tools.__version__ (${version:-not found})"
            exit 1
          fi

  push:
    name: Push to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
