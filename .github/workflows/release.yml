name: Release

# A vX.Y.Z tag publishes cv-tools to PyPI; docker.yml pushes the image for the same tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compare the tag with cv_tools.__version__
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/cv_tools/__init__.py)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} does not match cv_tools.__version__ (${version:-not found})"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel in a fresh venv and build a CV with it
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/smoke/bin/cv-tools" --version)" = "cv-tools ${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/smoke/bin/cv-tools" init
          "$RUNNER_TEMP/smoke/bin/cv-tools" validate cv.yaml
          "$RUNNER_TEMP/smoke/bin/cv-tools" build cv.yaml --tex-only -o out/cv.tex
          test -s out/cv.tex

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [ci, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cv-tools-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
