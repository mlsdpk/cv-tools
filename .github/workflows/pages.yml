name: Web app

# Builds and tests the browser app (web/) on every push and pull request. Only a release tag
# (vX.Y.Z, as for PyPI and Docker) deploys it to GitHub Pages, at https://cv-tools.phonethk.com/.
on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  # Deploys when run against a release tag.
  workflow_dispatch:

permissions:
  contents: read

# Not "github.workflow": ci.yml, called below, uses that group and would wait on this run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Check for a release tag
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.tag.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare a release tag with cv_tools.__version__
        id: tag
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] || ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/cv_tools/__init__.py)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} does not match cv_tools.__version__ (${version:-not found})"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  ci:
    name: Tests
    needs: release
    if: needs.release.outputs.deploy == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and test the web app
    needs: release
    runs-on: ubuntu-latest
    env:
      # The e2e tests compare the app's .tex and PDF with the CLI run by this Python.
      CV_TOOLS_PYTHON: python
      # The engine build and tests run cv_tools and pypdf with this Python (no .venv in CI).
      PYTHON: python
      DEPLOY: ${{ needs.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/engine/package-lock.json

      # Pyodide, its wheels and the pinned PyPI wheels, each stored under its SHA256.
      - name: Cache the web app's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.cache
          key: web-assets-${{ runner.os }}-${{ hashFiles('web/scripts/wheels.json', 'web/package-lock.json') }}

      # The engine release archive named in engine.lock.json.
      - name: Cache the engine release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/engine/.cache
          key: web-engine-${{ runner.os }}-${{ hashFiles('web/engine/engine.lock.json') }}

      # The engine bundle records its texmf tree from a native pdflatex run, and the engine and
      # e2e tests compare the browser PDF with the CLI PDF.
      - name: Install TeX Live 2026
        uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f # v4.1.1
        with:
          version: 2026
          packages: latex-bin
          package-file: src/cv_tools/templates/latex/packages.txt

      - name: Install pdftoppm for the pixel comparison
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # The test extra brings pypdf, which the engine's parity tests use for the link annotations.
      - name: Install cv-tools
        run: python -m pip install -e '.[test]'

      - name: Build the cv_tools wheel for Pyodide
        run: python -m pip wheel . -w "$RUNNER_TEMP/wheel" --no-deps

      - name: Install the web dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix web/engine

      # web/ and web/engine/ pin the same Playwright (1.64.1), so one install serves both.
      - name: Install the Playwright browsers
        run: |
          query='.packages["node_modules/playwright-core"].version'
          web=$(jq -r "$query" web/package-lock.json)
          engine=$(jq -r "$query" web/engine/package-lock.json)
          if [ "$web" != "$engine" ]; then
            echo "::error::web/ pins Playwright $web and web/engine/ pins $engine; install both browser sets"
            exit 1
          fi
          npx --prefix web playwright install --with-deps chromium webkit

      - name: Fetch and verify the pdfTeX WebAssembly engine
        run: npm --prefix web/engine run fetch

      - name: Build the engine bundle and format
        run: npm --prefix web/engine run build

      - name: Run the engine tests (parity with the CLI in Node, Chromium and WebKit)
        run: npm --prefix web/engine test

      - name: Build the site
        run: npm --prefix web run build
        env:
          CV_TOOLS_WHEEL: ${{ runner.temp }}/wheel

      - name: Run the unit tests
        run: npm --prefix web test

      - name: Run the end-to-end tests
        working-directory: web
        run: npx playwright test

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
            web/engine/test/_artifacts/
          if-no-files-found: ignore

      - name: Upload the site
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    if: needs.release.outputs.deploy == 'true'
    needs: [release, ci, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
