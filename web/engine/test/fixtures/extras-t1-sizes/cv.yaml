          latex: '{\footnotesize €} {\Large\textit{€}} \textsf{€} {\fontencoding{T1}\selectfont\footnotesize \ng\ \guillemotleft\ \DH\ \th\ \textsc{\ng} \texttt{\textit{\ng}}}'
        date:
