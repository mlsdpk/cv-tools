[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-tools"
dynamic = ["version"]
description = "Generate a LaTeX CV from a YAML file"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Phone Thiha Kyaw" }]
requires-python = ">=3.10"
keywords = ["cv", "resume", "latex", "yaml", "curriculum-vitae", "bibtex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.0",
    "pybtex>=0.24",
    "jsonschema>=4.18",
    "ruamel.yaml>=0.17.21",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "hypothesis>=6",
    "Pillow>=9",
    "pytest-cov>=4",
    "pypdf>=3",
]
# For tests/test_fidelity.py, with 'python -m playwright install chromium'.
fidelity = ["playwright==1.64.1"]

[project.scripts]
cv-tools = "cv_tools.cli:main"

[project.urls]
Homepage = "https://github.com/mlsdpk/cv-tools"
Repository = "https://github.com/mlsdpk/cv-tools"
Issues = "https://github.com/mlsdpk/cv-tools/issues"
Changelog = "https://github.com/mlsdpk/cv-tools/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "cv_tools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_tools = [
    "schema/*.json",
    "templates/latex/*.jinja",
    "templates/latex/layouts/*.jinja",
    "templates/latex/resume.cls",
    "templates/latex/orcid.pdf",
    "templates/latex/packages.txt",
    "templates/latex/unicode.txt",
    "templates/html/*.jinja",
    "templates/html/cv.css",
    "templates/html/icons/*.svg",
    "starter/cv.yaml",
    "starter/publications.bib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "tex: needs pdflatex (skipped when it is not installed)",
]
filterwarnings = [
    # test_version.py asserts this warning itself.
    "ignore:.*uses the v1 format:DeprecationWarning",
]
